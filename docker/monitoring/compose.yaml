services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: voidwar-node-exporter
    restart: unless-stopped

    network_mode: host
    pid: host

    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100

    volumes:
      - /:/host:ro,rslave

    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.5.2
    container_name: voidwar-prometheus
    restart: unless-stopped

    network_mode: host

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.listen-address=127.0.0.1:9090

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana-oss:12.1.1
    container_name: voidwar-grafana
    restart: unless-stopped

    network_mode: host

    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: 3000
      GF_SERVER_ROOT_URL: https://grafana.voidwar.net
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}

    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    security_opt:
      - no-new-privileges:true

volumes:
  prometheus-data:
